<div
  class="carousel-wrapper"
  role="region"
  aria-roledescription="carrossel"
  aria-label="Parceiros"
  (mouseenter)="setPaused(true)"
  (mouseleave)="setPaused(false)"
  (focusin)="setPaused(true)"
  (focusout)="setPaused(false)"
>
  <button type="button" class="carousel-btn carousel-btn-prev bg-gradient-primary-to-secondary" aria-label="Anterior" (click)="previous()">
    <i class="bi bi-chevron-left"></i>
  </button>

  <div class="carousel-viewport">
    <ul class="carousel-track list-unstyled m-0" [style.transform]="transform()">
      @for (partner of partners(); track partner.logoUrl) {
        <li class="carousel-item-slot" [style.flex-basis]="itemWidth()">
          @if (partner.url) {
            <a class="partner-card card border-0 shadow-sm rounded-4" [href]="partner.url" target="_blank" rel="noopener" [title]="partner.name">
              <img [src]="partner.logoUrl" [alt]="partner.name" loading="lazy" />
            </a>
          } @else {
            <div class="partner-card card border-0 shadow-sm rounded-4" [title]="partner.name">
              <img [src]="partner.logoUrl" [alt]="partner.name" loading="lazy" />
            </div>
          }
        </li>
      }
    </ul>
  </div>

  <button type="button" class="carousel-btn carousel-btn-next bg-gradient-primary-to-secondary" aria-label="Próximo" (click)="next()">
    <i class="bi bi-chevron-right"></i>
  </button>
</div>

@if (pages().length > 1) {
  <div class="carousel-dots d-flex justify-content-center gap-2 mt-4">
    @for (page of pages(); track page) {
      <button
        type="button"
        class="carousel-dot"
        [class.active]="page === index()"
        [attr.aria-label]="'Ir para a posição ' + (page + 1)"
        [attr.aria-current]="page === index()"
        (click)="goTo(page)"
      ></button>
    }
  </div>
}
