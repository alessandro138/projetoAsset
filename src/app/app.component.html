<main class="flex-shrink-0">
  <!-- Navegação (template Start Bootstrap - Personal) -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 d-print-none">
    <div class="container px-4 px-lg-5">
      <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/principal">
        <img src="logo-asset.png" alt="" height="48" />
        <span class="fw-bolder text-primary">ASSET</span>
      </a>
      <button
        class="navbar-toggler"
        type="button"
        aria-controls="mainNav"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir menu"
        (click)="menuOpen.set(!menuOpen())"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="mainNav" class="collapse navbar-collapse" [class.show]="menuOpen()">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" routerLink="/principal" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/principal" fragment="destaques">Destaques</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/principal" fragment="noticias">Notícias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/principal" fragment="sobre">Sobre nós</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/principal" fragment="contato">Contato</a>
          </li>
          <li class="nav-item dropdown">
            <button
              type="button"
              class="nav-link dropdown-toggle"
              [attr.aria-expanded]="adminMenuOpen()"
              (click)="toggleAdminMenu($event)"
            >
              <i class="bi bi-lock-fill me-1"></i>Área restrita
            </button>
            <ul class="dropdown-menu dropdown-menu-end" [class.show]="adminMenuOpen()">
              <li><a class="dropdown-item" routerLink="/cadastro/pessoas">Cadastro de pessoas</a></li>
              <li><a class="dropdown-item" routerLink="/cadastro/usuarios">Usuários</a></li>
              <li><a class="dropdown-item" routerLink="/ativosPatrimonio">Ativos e patrimônio</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <router-outlet />
</main>

<!-- Rodapé -->
<footer class="bg-white py-4 mt-auto border-top d-print-none">
  <div class="container px-4 px-lg-5">
    <div class="row align-items-center justify-content-between flex-column flex-sm-row gap-2">
      <div class="col-auto">
        <div class="small m-0">&copy; {{ year }} {{ footer().organizationName }}</div>
      </div>
      <div class="col-auto">
        @for (link of footer().links; track link.href; let last = $last) {
          <app-smart-link [href]="link.href" linkClass="small">{{ link.label }}</app-smart-link>
          @if (!last) {
            <span class="mx-1">&middot;</span>
          }
        }
      </div>
    </div>
  </div>
</footer>
