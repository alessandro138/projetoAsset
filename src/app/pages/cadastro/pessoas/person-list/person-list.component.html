<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
  <h1 class="fw-bolder mb-0"><span class="text-gradient d-inline">Pessoas</span></h1>
  <a routerLink="nova" class="btn btn-secondary fw-bolder"><i class="bi bi-person-plus-fill me-2"></i>Nova pessoa</a>
</div>

@if (rows().length === 0) {
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4 text-center text-muted">Nenhuma pessoa cadastrada ainda.</div>
  </div>
} @else {
  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Idade</th>
            <th>Tipo</th>
            <th>Tutor legal</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.id) {
            <tr>
              <td class="fw-bold">{{ row.fullName }}</td>
              <td class="font-monospace">{{ row.cpf }}</td>
              <td>{{ row.age }}</td>
              <td>{{ row.types }}</td>
              <td>{{ row.guardian }}</td>
              <td class="text-end">
                <a [routerLink]="row.id" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil me-1"></i>Editar</a>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
